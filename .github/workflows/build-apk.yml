name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'Counter.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Counter Android APK (v2.1)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER=$(command -v sdkmanager || find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found in $SDK_ROOT"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER (root: $SDK_ROOT)"
          (yes || true) | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          (yes || true) | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Type check and build web assets
        run: |
          npm run lint
          npm run build

      - name: Prepare Capacitor Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Native Vibration, Fingerprint Bridge, Persistent Keystore, and Version
        run: |
          node scripts/configure-android.mjs

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish Counter.apk directly to repository file list & Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp -f android/app/build/outputs/apk/debug/app-debug.apk ./Counter.apk

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Counter.apk
          if ! git diff --staged --quiet; then
            git commit -m "chore: update Counter.apk in repository root [skip ci]"
            BRANCH="${GITHUB_REF_NAME:-main}"
            git pull --rebase origin "$BRANCH" || true
            git push origin "HEAD:$BRANCH" || true
          fi

          gh release create latest ./Counter.apk --title "Counter v2.1 APK" --notes "Direct Android APK download (Counter.apk)" --clobber || \
          gh release upload latest ./Counter.apk --clobber || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Counter-Android-APK-v2.1
          path: Counter.apk
          retention-days: 30
