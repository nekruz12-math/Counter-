name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Counter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER=$(command -v sdkmanager || find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found in $SDK_ROOT"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER (root: $SDK_ROOT)"
          (yes || true) | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          (yes || true) | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Type check and build web assets
        run: |
          npm run lint
          npm run build

      - name: Prepare Capacitor Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Android manifest permissions and app icons
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "android.permission.VIBRATE" "$MANIFEST"; then
              sed -i 's|</manifest>|    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>|' "$MANIFEST"
            fi
            if ! grep -q "android.permission.POST_NOTIFICATIONS" "$MANIFEST"; then
              sed -i 's|</manifest>|    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>|' "$MANIFEST"
            fi
          fi

          BG_XML="android/app/src/main/res/values/ic_launcher_background.xml"
          if [ -f "$BG_XML" ]; then
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#A4382A</color>\n</resources>\n' > "$BG_XML"
          fi

          for density in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            dir="android/app/src/main/res/$density"
            if [ -d "$dir" ]; then
              if [ -f "public/android-icon-192.png" ]; then
                cp -f public/android-icon-192.png "$dir/ic_launcher.png"
                cp -f public/android-icon-192.png "$dir/ic_launcher_round.png"
              fi
              if [ -f "public/android-icon-maskable.png" ]; then
                cp -f public/android-icon-maskable.png "$dir/ic_launcher_foreground.png"
              fi
            fi
          done

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Counter-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
