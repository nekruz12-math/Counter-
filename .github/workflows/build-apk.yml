name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'Counter.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Counter Android APK (v2.0)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER=$(command -v sdkmanager || find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found in $SDK_ROOT"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER (root: $SDK_ROOT)"
          (yes || true) | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          (yes || true) | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Type check and build web assets
        run: |
          npm run lint
          npm run build

      - name: Prepare Capacitor Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Version 2.0, Persistent Signing Keystore, and Android Manifest
        run: |
          mkdir -p "$HOME/.android"
          KEYSTORE_B64=""
          echo "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"

          APP_GRADLE="android/app/build.gradle"
          RUN_NUM="${GITHUB_RUN_NUMBER:-1}"
          VERSION_CODE=$((200 + RUN_NUM))
          VERSION_NAME="2.0.${RUN_NUM}"
          if [ -f "$APP_GRADLE" ]; then
            sed -i "s/versionCode [0-9]\+/versionCode ${VERSION_CODE}/g" "$APP_GRADLE"
            sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/g" "$APP_GRADLE"
            echo "Configured Android APK versionCode=${VERSION_CODE}, versionName=${VERSION_NAME}"
          fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:allowBackup="false"/android:allowBackup="true"/g' "$MANIFEST"
            if ! grep -q "android.permission.VIBRATE" "$MANIFEST"; then
              sed -i 's|</manifest>|    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>|' "$MANIFEST"
            fi
            if ! grep -q "android.permission.POST_NOTIFICATIONS" "$MANIFEST"; then
              sed -i 's|</manifest>|    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>|' "$MANIFEST"
            fi
          fi

          BG_XML="android/app/src/main/res/values/ic_launcher_background.xml"
          if [ -f "$BG_XML" ]; then
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#A4382A</color>\n</resources>\n' > "$BG_XML"
          fi

          for density in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            dir="android/app/src/main/res/$density"
            if [ -d "$dir" ]; then
              if [ -f "public/android-icon-192.png" ]; then
                cp -f public/android-icon-192.png "$dir/ic_launcher.png"
                cp -f public/android-icon-192.png "$dir/ic_launcher_round.png"
              fi
              if [ -f "public/android-icon-maskable.png" ]; then
                cp -f public/android-icon-maskable.png "$dir/ic_launcher_foreground.png"
              fi
            fi
          done

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish Counter.apk directly to repository file list & Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp -f android/app/build/outputs/apk/debug/app-debug.apk ./Counter.apk

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Counter.apk
          if ! git diff --staged --quiet; then
            git commit -m "chore: update Counter.apk in repository root [skip ci]"
            BRANCH="${GITHUB_REF_NAME:-main}"
            git pull --rebase origin "$BRANCH" || true
            git push origin "HEAD:$BRANCH" || true
          fi

          gh release create latest ./Counter.apk --title "Counter v2.0 APK" --notes "Direct Android APK download (Counter.apk)" --clobber || \
          gh release upload latest ./Counter.apk --clobber || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Counter-Android-APK-v2.0
          path: Counter.apk
          retention-days: 30
